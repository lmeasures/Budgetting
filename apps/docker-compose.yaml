version: "3.8"
networks:
  workspaces:
services:
  express-api-a:
    container_name: express-api-a
    build:
      context: .
      dockerfile: ./express-api-a/dockerfile
    image: express-api-a:latest
    networks:
      - workspaces
    ports:
      - 3001:3001
    volumes:
      - ./express-api-a:/app/express-api-a
      - ./@csl/functions:/app/@csl/functions
      - ./@csl/interfaces:/app/@csl/interfaces
  front-end:
    build:
      context: .
      dockerfile: ./front-end/dockerfile
    image: front-end:latest
    container_name: front-end
    ports:
      - 3000:3000
    expose:
      - 3000
    networks:
      - workspaces
    volumes:
      - ./front-end:/app/front-end
      - ./@csl:/app/@csl
