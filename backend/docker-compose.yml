version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: budgetting-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: budgetting-dev
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 -u root -p password --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: budgetting-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI_PROD: mongodb://root:password@mongodb:27017/budgetting-dev?authSource=admin
      JWT_SECRET: dev-secret-key-change-in-production
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:

networks:
  default:
    name: budgetting-network
